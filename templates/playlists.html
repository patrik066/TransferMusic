<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlists</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="content">
        <h1>Your Spotify Playlists</h1>
        <ul class="playlist-grid">
            {% for playlist in playlists %}
                <li>
                    <h2>{{ playlist.name }}</h2>
                    {% if playlist.images %}
                        <img src="{{ playlist.images[0].url }}" alt="Thumbnail">
                    {% else %}
                        <img src="{{ url_for('static', filename='default_playlist.png') }}" alt="Default Thumbnail">
                    {% endif %}
                    <button onclick="transferToYouTube('{{ playlist.id }}')">Transfer to YouTube</button>
                    <div class="transfer-status" id="status-{{ playlist.id }}"></div>
                </li>
            {% endfor %}
        </ul>
        <div class="button-group">
            <a href="/"><button>Home</button></a>
        </div>
    </div>
    <footer>© 2025 TransferMusic | <a href="/privacy_policy">Privacy Policy</a> | <a href="/terms_of_service">Terms of Service</a></footer>

    <script>
        function transferToYouTube(playlistId) {
            var statusDiv = document.getElementById("status-" + playlistId);
            statusDiv.innerHTML = "Transferring... Please wait.";
            $.ajax({
                url: "/transfer_playlist",
                type: "GET",
                data: { playlist_id: playlistId },
                success: function(response) {
                    console.log("Success from /transfer_playlist:", response);
                    if (response.message === "Playlist transferred successfully") {
                        statusDiv.innerHTML = "Success! Check your YouTube playlists.";
                    }
                },
                error: function(xhr) {
                    console.log("Error from /transfer_playlist:", xhr.responseJSON);
                    if (xhr.responseJSON && xhr.responseJSON.redirect) {
                        window.location.href = xhr.responseJSON.redirect;
                    } else {
                        statusDiv.innerHTML = "Error: " + (xhr.responseJSON?.error || "Transfer failed.");
                    }
                }
            });
        }

        // Retry the transfer after returning from authentication.
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const playlistId = urlParams.get('playlist_id');
            if (playlistId) {
                transferToYouTube(playlistId);
                // Clean the URL to prevent repeated transfer requests.
                window.history.replaceState({}, document.title, '/playlists');
            }
        });
    </script>
</body>
</html>
